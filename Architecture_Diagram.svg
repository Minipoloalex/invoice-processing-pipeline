<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="bold">Invoice Processing Pipeline Architecture</text>
  
  <!-- ERP API Box -->
  <rect x="50" y="80" width="160" height="80" rx="8" fill="#1e1e2e" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="115" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="14" font-weight="600">ERP API</text>
  <text x="130" y="140" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="11">Mock endpoints</text>
  
  <!-- Arrow 1 -->
  <line x1="210" y1="120" x2="280" y2="120" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Your Solution Box -->
  <rect x="280" y="80" width="200" height="80" rx="8" fill="#1e1e2e" stroke="#22d3ee" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" fill="#67e8f9" font-family="system-ui" font-size="14" font-weight="600">Your Solution</text>
  <text x="380" y="140" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="11">Extract &amp; Process</text>
  
  <!-- Arrow 2 -->
  <line x1="480" y1="120" x2="550" y2="120" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Dashboard Box -->
  <rect x="550" y="80" width="200" height="80" rx="8" fill="#1e1e2e" stroke="#10b981" stroke-width="2"/>
  <text x="650" y="115" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="14" font-weight="600">Dashboard</text>
  <text x="650" y="140" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="11">Review results</text>
  
  <!-- Bottom row -->
  <rect x="150" y="240" width="200" height="70" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="272" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="13" font-weight="600">Invoice Data</text>
  <text x="250" y="292" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="11">5 invoices, 3 vendors</text>
  
  <rect x="420" y="240" width="200" height="70" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="272" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="13" font-weight="600">Processed Output</text>
  <text x="520" y="292" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="11">Validated &amp; submitted</text>
  
  <!-- Vertical arrows -->
  <line x1="250" y1="160" x2="250" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="160" x2="520" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <text x="400" y="370" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="12">Candidates build the middle layer connecting ERP data to a review dashboard</text>
</svg>
